name: Release Distributions

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not a release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  test:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev ninja-build cmake

      - name: Run test suite
        run: make test

  linux:
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxft-dev ninja-build cmake xvfb scrot openbox

      - name: Build Linux API distribution
        run: make dist-api

      - name: Capture Linux GUI screenshot
        shell: bash
        run: |
          mkdir -p release-assets
          SKRED_NO_AUDIO=1 SK3_GUI_EXPANDED=1 xvfb-run -s "-screen 0 1024x768x24" bash -c '
            openbox &
            sleep 1
            dist/linux-x86_64/skred-${VERSION}-maxed/bin/sk3-gui &
            APP_PID=$!
            sleep 3
            scrot release-assets/raw-screenshot.png || import -window root release-assets/raw-screenshot.png || true
            kill $APP_PID 2>/dev/null || true
          '
          if [ -f release-assets/raw-screenshot.png ]; then
            # Crop to show ONLY the app window
            convert release-assets/raw-screenshot.png -trim +repage release-assets/linux-gui-screenshot.png || cp release-assets/raw-screenshot.png release-assets/linux-gui-screenshot.png
            rm -f release-assets/raw-screenshot.png
            cp release-assets/linux-gui-screenshot.png "dist/linux-x86_64/skred-${VERSION}-maxed/"
            cmake -E chdir dist/linux-x86_64 cmake -E tar czf "skred-${VERSION}-maxed-linux-x86_64.tar.gz" --format=gnutar "skred-${VERSION}-maxed"
          fi

      - name: Verify and name release asset
        shell: bash
        run: |
          set -euo pipefail
          source="dist/linux-x86_64/skred-${VERSION}-maxed-linux-x86_64.tar.gz"
          test -f "$source"
          tar -tzf "$source" > archive-contents.txt
          grep -q "skred-${VERSION}-maxed/include/skred/api.h" archive-contents.txt
          grep -q "skred-${VERSION}-maxed/bin/sk3-gui" archive-contents.txt
          grep -q "skred-${VERSION}-maxed/linux-gui-screenshot.png" archive-contents.txt
          mkdir -p release-assets
          cp "$source" "release-assets/"

      - uses: actions/upload-artifact@v4
        with:
          name: api-linux-x86_64
          path: release-assets/*
          if-no-files-found: error

  linux-armhf:
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM32 cross-build dependencies
        run: |
          sudo dpkg --add-architecture armhf
          sudo dpkg --add-architecture arm64
          distro="$(. /etc/os-release && echo "${UBUNTU_CODENAME:-noble}")"
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64/g' /etc/apt/sources.list.d/ubuntu.sources
            cat << APT | sudo tee /etc/apt/sources.list.d/ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${distro} ${distro}-updates ${distro}-backports ${distro}-security
          Components: main universe restricted multiverse
          Architectures: armhf arm64
          APT
          else
            sudo sed -i 's/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
            cat << APT | sudo tee /etc/apt/sources.list.d/ports.list
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro} main restricted universe multiverse
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro}-updates main restricted universe multiverse
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro}-backports main restricted universe multiverse
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro}-security main restricted universe multiverse
          APT
          fi
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libasound2-dev:armhf ninja-build cmake

      - name: Build maxed Linux ARM32 API distribution
        run: make dist-api-linux-armhf

      - name: Verify and name release asset
        shell: bash
        run: |
          set -euo pipefail
          source="dist/linux-armhf/skred-${VERSION}-maxed-linux-armhf.tar.gz"
          asset="skred-${VERSION}-maxed-linux-armhf.tar.gz"
          test -f "$source"
          tar -tzf "$source" > archive-contents.txt
          grep -q "skred-${VERSION}-maxed/include/skred/api.h" archive-contents.txt
          mkdir -p release-assets
          cp "$source" "release-assets/$asset"

      - uses: actions/upload-artifact@v4
        with:
          name: api-linux-armhf
          path: release-assets/*
          if-no-files-found: error

  linux-aarch64:
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-build dependencies
        run: |
          sudo dpkg --add-architecture armhf
          sudo dpkg --add-architecture arm64
          distro="$(. /etc/os-release && echo "${UBUNTU_CODENAME:-noble}")"
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64/g' /etc/apt/sources.list.d/ubuntu.sources
            cat << APT | sudo tee /etc/apt/sources.list.d/ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${distro} ${distro}-updates ${distro}-backports ${distro}-security
          Components: main universe restricted multiverse
          Architectures: armhf arm64
          APT
          else
            sudo sed -i 's/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
            cat << APT | sudo tee /etc/apt/sources.list.d/ports.list
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro} main restricted universe multiverse
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro}-updates main restricted universe multiverse
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro}-backports main restricted universe multiverse
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro}-security main restricted universe multiverse
          APT
          fi
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev:arm64 ninja-build cmake

      - name: Build maxed Linux ARM64 API distribution
        run: make dist-api-linux-aarch64

      - name: Verify and name release asset
        shell: bash
        run: |
          set -euo pipefail
          source="dist/linux-aarch64/skred-${VERSION}-maxed-linux-aarch64.tar.gz"
          asset="skred-${VERSION}-maxed-linux-aarch64.tar.gz"
          test -f "$source"
          tar -tzf "$source" > archive-contents.txt
          grep -q "skred-${VERSION}-maxed/include/skred/api.h" archive-contents.txt
          mkdir -p release-assets
          cp "$source" "release-assets/$asset"

      - uses: actions/upload-artifact@v4
        with:
          name: api-linux-aarch64
          path: release-assets/*
          if-no-files-found: error

  macos:
    needs: metadata
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build maxed universal macOS API distribution
        run: make dist-api MACOS_UNIVERSAL=1

      - name: Capture macOS GUI screenshot
        shell: bash
        run: |
          mkdir -p release-assets
          APP_PATH="dist/macos-universal/skred-${VERSION}-maxed/sk3.app/Contents/MacOS/sk3-gui"
          if [ -f "$APP_PATH" ]; then
            SKRED_NO_AUDIO=1 SK3_GUI_EXPANDED=1 "$APP_PATH" &
            APP_PID=$!
            sleep 3
            screencapture -x release-assets/raw-macos.png || true
            kill $APP_PID 2>/dev/null || true
          fi
          if [ -f release-assets/raw-macos.png ]; then
            # Crop menu bar (top 30px) and trim black desktop wallpaper to show ONLY the window
            python3 -c "
from PIL import Image
im = Image.open('release-assets/raw-macos.png')
w, h = im.size
min_x, min_y, max_x, max_y = w, h, 0, 0
for y in range(32, h):
    for x in range(w):
        r, g, b = im.getpixel((x, y))[:3]
        if (r, g, b) != (0, 0, 0):
            if x < min_x: min_x = x
            if x > max_x: max_x = x
            if y < min_y: min_y = y
            if y > max_y: max_y = y
if max_x > min_x and max_y > min_y:
    cropped = im.crop((min_x, min_y, max_x + 1, max_y + 1))
    cropped.save('release-assets/macos-gui-screenshot.png')
else:
    im.save('release-assets/macos-gui-screenshot.png')
" || cp release-assets/raw-macos.png release-assets/macos-gui-screenshot.png
            rm -f release-assets/raw-macos.png
            cp release-assets/macos-gui-screenshot.png "dist/macos-universal/skred-${VERSION}-maxed/"
            cmake -E chdir dist/macos-universal cmake -E tar czf "skred-${VERSION}-maxed.tar.gz" --format=gnutar "skred-${VERSION}-maxed"
          fi

      - name: Verify and name release asset
        shell: bash
        run: |
          set -euo pipefail
          source="dist/macos-universal/skred-${VERSION}-maxed.tar.gz"
          asset="skred-${VERSION}-maxed-macos-universal.tar.gz"
          test -f "$source"
          tar -tzf "$source" > archive-contents.txt
          grep -q "skred-${VERSION}-maxed/include/skred/api.h" archive-contents.txt
          grep -q "skred-${VERSION}-maxed/sk3.app/Contents/MacOS/sk3-gui" archive-contents.txt
          grep -q "skred-${VERSION}-maxed/macos-gui-screenshot.png" archive-contents.txt
          mkdir -p release-assets
          cp "$source" "release-assets/$asset"

      - uses: actions/upload-artifact@v4
        with:
          name: api-macos-universal
          path: release-assets/*
          if-no-files-found: error

  windows:
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install Windows cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build binutils-mingw-w64-x86-64 xvfb scrot
          sudo apt-get install -y wine64 || sudo apt-get install -y wine || true

      - name: Build maxed Windows API distribution
        run: make dist-api-windows

      - name: Capture Windows GUI screenshot
        shell: bash
        run: |
          mkdir -p release-assets
          EXE_PATH="dist/windows-x86_64/skred-${VERSION}-maxed/bin/sk3-gui.exe"
          if [ -f "$EXE_PATH" ]; then
            export WINEDLLOVERRIDES="mscoree,mshtml="
            export WINEDEBUG=-all
            wineboot --init || true
            SKRED_NO_AUDIO=1 SK3_GUI_EXPANDED=1 xvfb-run -s "-screen 0 1024x768x24" bash -c "
              (wine64 \"$EXE_PATH\" || wine \"$EXE_PATH\") &
              sleep 4
              scrot release-assets/raw-windows.png || import -window root release-assets/raw-windows.png || true
              wineserver -k || true
            " || true
          fi
          if [ -f release-assets/raw-windows.png ]; then
            # Crop to show ONLY the app window
            convert release-assets/raw-windows.png -trim +repage release-assets/windows-gui-screenshot.png || cp release-assets/raw-windows.png release-assets/windows-gui-screenshot.png
            rm -f release-assets/raw-windows.png
            cp release-assets/windows-gui-screenshot.png "dist/windows-x86_64/skred-${VERSION}-maxed/"
            cmake -E chdir dist/windows-x86_64 cmake -E tar cf "skred-${VERSION}-maxed.zip" --format=zip "skred-${VERSION}-maxed"
          fi

      - name: Verify and name release asset
        shell: bash
        run: |
          set -euo pipefail
          source="dist/windows-x86_64/skred-${VERSION}-maxed.zip"
          asset="skred-${VERSION}-maxed-windows-x86_64.zip"
          test -f "$source"
          unzip -l "$source" > archive-contents.txt
          grep -q "skred-${VERSION}-maxed/include/skred/api.h" archive-contents.txt
          grep -q "skred-${VERSION}-maxed/bin/sk3-gui.exe" archive-contents.txt
          grep -q "skred-${VERSION}-maxed/windows-gui-screenshot.png" archive-contents.txt
          mkdir -p release-assets
          cp "$source" "release-assets/$asset"

      - uses: actions/upload-artifact@v4
        with:
          name: api-windows-x86_64
          path: release-assets/*
          if-no-files-found: error

  wasm:
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev ninja-build cmake nodejs

      - name: Build WASM distribution
        run: make dist-api-wasm CMAKE=/usr/bin/cmake NODE="${EMSDK_NODE:-node}"

      - name: Verify and name release asset
        shell: bash
        run: |
          set -euo pipefail
          source="dist/wasm/skred-${VERSION}-maxed-wasm.zip"
          test -f "$source"
          unzip -l "$source" > archive-contents.txt
          grep -q "skred-${VERSION}-maxed/skred_api.js" archive-contents.txt
          grep -q "skred-${VERSION}-maxed/skred_api.wasm" archive-contents.txt
          mkdir -p release-assets
          cp "$source" "release-assets/"

      - uses: actions/upload-artifact@v4
        with:
          name: api-wasm
          path: release-assets/*
          if-no-files-found: error

  release:
    needs:
      - metadata
      - test
      - linux
      - linux-armhf
      - linux-aarch64
      - macos
      - windows
      - wasm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.metadata.outputs.version }}
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: api-*
          path: release-assets
          merge-multiple: true

      - name: Validate release payload
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "skred-${VERSION}-maxed-linux-x86_64.tar.gz"
            "skred-${VERSION}-maxed-linux-armhf.tar.gz"
            "skred-${VERSION}-maxed-linux-aarch64.tar.gz"
            "skred-${VERSION}-maxed-macos-universal.tar.gz"
            "skred-${VERSION}-maxed-windows-x86_64.zip"
            "skred-${VERSION}-maxed-wasm.zip"
          )
          for asset in "${expected[@]}"; do
            test -s "release-assets/$asset"
          done
          screenshots=(
            "linux-gui-screenshot.png"
            "macos-gui-screenshot.png"
            "windows-gui-screenshot.png"
          )
          for shot in "${screenshots[@]}"; do
            test -s "release-assets/$shot"
          done
          (
            cd release-assets
            sha256sum "${expected[@]}" > SHA256SUMS
          )

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          notes_body=$(cat << 'EOF'
### Native Desktop GUIs

| Linux (X11 / Xft) | macOS (Cocoa) | Windows (Win32) |
| :---: | :---: | :---: |
| <a href="https://github.com/octetta/sk3/releases/download/TAG_PLACEHOLDER/linux-gui-screenshot.png"><img src="https://github.com/octetta/sk3/releases/download/TAG_PLACEHOLDER/linux-gui-screenshot.png" alt="Linux GUI" width="300" /></a> | <a href="https://github.com/octetta/sk3/releases/download/TAG_PLACEHOLDER/macos-gui-screenshot.png"><img src="https://github.com/octetta/sk3/releases/download/TAG_PLACEHOLDER/macos-gui-screenshot.png" alt="macOS GUI" width="300" /></a> | <a href="https://github.com/octetta/sk3/releases/download/TAG_PLACEHOLDER/windows-gui-screenshot.png"><img src="https://github.com/octetta/sk3/releases/download/TAG_PLACEHOLDER/windows-gui-screenshot.png" alt="Windows GUI" width="300" /></a> |

EOF
          )
          notes_body="${notes_body//TAG_PLACEHOLDER/$TAG}"
          echo "$notes_body" > /tmp/release_notes_intro.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets if needed."
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --notes-file /tmp/release_notes_intro.md
          else
            release_args=(
              --target "$GITHUB_SHA"
              --title "SKRED $VERSION"
              --notes-file /tmp/release_notes_intro.md
              --generate-notes
            )
            if [[ "$VERSION" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$TAG" release-assets/* "${release_args[@]}"
          fi

      - name: Dispatch downstream web builds
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for repo in "octetta/skred-web" "octetta/skode-repl"; do
            echo "Attempting dispatch to $repo for v$VERSION..."
            gh api "repos/$repo/dispatches" \
              -X POST \
              -F "event_type=pulp_release" \
              -F "client_payload[version]=$VERSION" 2>/dev/null || echo "Dispatch to $repo skipped"
          done
