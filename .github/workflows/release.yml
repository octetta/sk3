name: Release Distributions

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not a release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  test:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev ninja-build cmake

      - name: Run test suite
        run: make test

  linux:
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxft-dev ninja-build cmake

      - name: Build Linux API distribution
        run: make dist-api

      - name: Verify and name release asset
        shell: bash
        run: |
          set -euo pipefail
          source="dist/linux-x86_64/skred-${VERSION}-maxed-linux-x86_64.tar.gz"
          test -f "$source"
          tar -tzf "$source" > archive-contents.txt
          grep -q "skred-${VERSION}-maxed/include/skred/api.h" archive-contents.txt
          grep -q "skred-${VERSION}-maxed/bin/sk3-gui" archive-contents.txt
          mkdir -p release-assets
          cp "$source" "release-assets/"

      - uses: actions/upload-artifact@v4
        with:
          name: api-linux-x86_64
          path: release-assets/*
          if-no-files-found: error

  linux-armhf:
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM32 cross-build dependencies
        run: |
          sudo dpkg --add-architecture armhf
          sudo dpkg --add-architecture arm64
          distro="$(. /etc/os-release && echo "${UBUNTU_CODENAME:-noble}")"
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64/g' /etc/apt/sources.list.d/ubuntu.sources
            cat << APT | sudo tee /etc/apt/sources.list.d/ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${distro} ${distro}-updates ${distro}-backports ${distro}-security
          Components: main universe restricted multiverse
          Architectures: armhf arm64
          APT
          else
            sudo sed -i 's/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
            cat << APT | sudo tee /etc/apt/sources.list.d/ports.list
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro} main restricted universe multiverse
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro}-updates main restricted universe multiverse
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro}-backports main restricted universe multiverse
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro}-security main restricted universe multiverse
          APT
          fi
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libasound2-dev:armhf ninja-build cmake

      - name: Build maxed Linux ARM32 API distribution
        run: make dist-api-linux-armhf

      - name: Verify and name release asset
        shell: bash
        run: |
          set -euo pipefail
          source="dist/linux-armhf/skred-${VERSION}-maxed-linux-armhf.tar.gz"
          asset="skred-${VERSION}-maxed-linux-armhf.tar.gz"
          test -f "$source"
          tar -tzf "$source" > archive-contents.txt
          grep -q "skred-${VERSION}-maxed/include/skred/api.h" archive-contents.txt
          mkdir -p release-assets
          cp "$source" "release-assets/$asset"

      - uses: actions/upload-artifact@v4
        with:
          name: api-linux-armhf
          path: release-assets/*
          if-no-files-found: error

  linux-aarch64:
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-build dependencies
        run: |
          sudo dpkg --add-architecture armhf
          sudo dpkg --add-architecture arm64
          distro="$(. /etc/os-release && echo "${UBUNTU_CODENAME:-noble}")"
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64/g' /etc/apt/sources.list.d/ubuntu.sources
            cat << APT | sudo tee /etc/apt/sources.list.d/ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${distro} ${distro}-updates ${distro}-backports ${distro}-security
          Components: main universe restricted multiverse
          Architectures: armhf arm64
          APT
          else
            sudo sed -i 's/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list
            cat << APT | sudo tee /etc/apt/sources.list.d/ports.list
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro} main restricted universe multiverse
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro}-updates main restricted universe multiverse
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro}-backports main restricted universe multiverse
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports ${distro}-security main restricted universe multiverse
          APT
          fi
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev:arm64 ninja-build cmake

      - name: Build maxed Linux ARM64 API distribution
        run: make dist-api-linux-aarch64

      - name: Verify and name release asset
        shell: bash
        run: |
          set -euo pipefail
          source="dist/linux-aarch64/skred-${VERSION}-maxed-linux-aarch64.tar.gz"
          asset="skred-${VERSION}-maxed-linux-aarch64.tar.gz"
          test -f "$source"
          tar -tzf "$source" > archive-contents.txt
          grep -q "skred-${VERSION}-maxed/include/skred/api.h" archive-contents.txt
          mkdir -p release-assets
          cp "$source" "release-assets/$asset"

      - uses: actions/upload-artifact@v4
        with:
          name: api-linux-aarch64
          path: release-assets/*
          if-no-files-found: error

  macos:
    needs: metadata
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build maxed universal macOS API distribution
        run: make dist-api MACOS_UNIVERSAL=1

      - name: Verify and name release asset
        shell: bash
        run: |
          set -euo pipefail
          source="dist/macos-universal/skred-${VERSION}-maxed.tar.gz"
          asset="skred-${VERSION}-maxed-macos-universal.tar.gz"
          test -f "$source"
          tar -tzf "$source" > archive-contents.txt
          grep -q "skred-${VERSION}-maxed/include/skred/api.h" archive-contents.txt
          grep -q "skred-${VERSION}-maxed/sk3.app/Contents/MacOS/sk3-gui" archive-contents.txt
          mkdir -p release-assets
          cp "$source" "release-assets/$asset"

      - uses: actions/upload-artifact@v4
        with:
          name: api-macos-universal
          path: release-assets/*
          if-no-files-found: error

  windows:
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install Windows cross-build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build binutils-mingw-w64-x86-64

      - name: Build maxed Windows API distribution
        run: make dist-api-windows

      - name: Verify and name release asset
        shell: bash
        run: |
          set -euo pipefail
          source="dist/windows-x86_64/skred-${VERSION}-maxed.zip"
          asset="skred-${VERSION}-maxed-windows-x86_64.zip"
          test -f "$source"
          unzip -l "$source" > archive-contents.txt
          grep -q "skred-${VERSION}-maxed/include/skred/api.h" archive-contents.txt
          grep -q "skred-${VERSION}-maxed/bin/sk3-gui.exe" archive-contents.txt
          mkdir -p release-assets
          cp "$source" "release-assets/$asset"

      - uses: actions/upload-artifact@v4
        with:
          name: api-windows-x86_64
          path: release-assets/*
          if-no-files-found: error

  wasm:
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev ninja-build cmake nodejs

      - name: Build WASM distribution
        run: make dist-api-wasm CMAKE=/usr/bin/cmake NODE="${EMSDK_NODE:-node}"

      - name: Verify and name release asset
        shell: bash
        run: |
          set -euo pipefail
          source="dist/wasm/skred-${VERSION}-maxed-wasm.zip"
          test -f "$source"
          unzip -l "$source" > archive-contents.txt
          grep -q "skred-${VERSION}-maxed/skred_api.js" archive-contents.txt
          grep -q "skred-${VERSION}-maxed/skred_api.wasm" archive-contents.txt
          mkdir -p release-assets
          cp "$source" "release-assets/"

      - uses: actions/upload-artifact@v4
        with:
          name: api-wasm
          path: release-assets/*
          if-no-files-found: error

  release:
    needs:
      - metadata
      - test
      - linux
      - linux-armhf
      - linux-aarch64
      - macos
      - windows
      - wasm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.metadata.outputs.version }}
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: api-*
          path: release-assets
          merge-multiple: true

      - name: Validate release payload
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "skred-${VERSION}-maxed-linux-x86_64.tar.gz"
            "skred-${VERSION}-maxed-linux-armhf.tar.gz"
            "skred-${VERSION}-maxed-linux-aarch64.tar.gz"
            "skred-${VERSION}-maxed-macos-universal.tar.gz"
            "skred-${VERSION}-maxed-windows-x86_64.zip"
            "skred-${VERSION}-maxed-wasm.zip"
          )
          for asset in "${expected[@]}"; do
            test -s "release-assets/$asset"
          done
          (
            cd release-assets
            sha256sum "${expected[@]}" > SHA256SUMS
          )

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets if needed."
            gh release upload "$TAG" release-assets/* --clobber
          else
            release_args=(
              --target "$GITHUB_SHA"
              --title "SKRED $VERSION"
              --generate-notes
            )
            if [[ "$VERSION" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$TAG" release-assets/* "${release_args[@]}"
          fi

      - name: Dispatch downstream web builds
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for repo in "octetta/skred-web" "octetta/skode-repl"; do
            echo "Attempting dispatch to $repo for v$VERSION..."
            gh api "repos/$repo/dispatches" \
              -X POST \
              -F "event_type=pulp_release" \
              -F "client_payload[version]=$VERSION" 2>/dev/null || echo "Dispatch to $repo skipped"
          done
